name: Payload word RAM RTL tests

on:
  push:
    branches:
      - main
      - feature/bonded-serdes-interconnect
    paths:
      - 'rtl/bonded_payload_word_ram.sv'
      - 'rtl/tb_bonded_payload_word_ram.sv'
      - 'rtl/bonded_wire_rx_lane_parallel_ram.sv'
      - 'rtl/tb_bonded_wire_rx_lane_parallel_ram.sv'
      - 'rtl/tb_bonded_wire_rx_lane_parallel_differential.sv'
      - '.github/workflows/payload-word-ram.yml'
  pull_request:
    paths:
      - 'rtl/tb_bonded_wire_rx_lane_parallel_differential.sv'
      - 'rtl/bonded_wire_rx_lane_parallel_ram.sv'
      - 'rtl/tb_bonded_wire_rx_lane_parallel_ram.sv'
      - 'rtl/bonded_payload_word_ram.sv'
      - 'rtl/tb_bonded_payload_word_ram.sv'
      - '.github/workflows/payload-word-ram.yml'

permissions:
  contents: read

concurrency:
  group: payload-word-ram-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-word-ram:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        data-width: [8, 16, 32]
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile
        run: |
          iverilog -g2012 -s tb_bonded_payload_word_ram \
            -Ptb_bonded_payload_word_ram.DATA_WIDTH=${{ matrix.data-width }} \
            -o /tmp/payload-ram.vvp \
            rtl/bonded_payload_word_ram.sv rtl/tb_bonded_payload_word_ram.sv
      - name: Simulate
        run: vvp /tmp/payload-ram.vvp
      - name: Compile RAM-backed RX candidate
        run: |
          iverilog -g2012 -s tb_bonded_wire_rx_lane_parallel_ram \
            -Ptb_bonded_wire_rx_lane_parallel_ram.DATA_WIDTH=${{ matrix.data-width }} \
            -o /tmp/parallel-rx-ram.vvp \
            rtl/bonded_payload_word_ram.sv \
            rtl/bonded_wire_rx_lane_parallel_ram.sv \
            rtl/tb_bonded_wire_rx_lane_parallel_ram.sv
      - name: Simulate RAM-backed RX candidate
        run: vvp /tmp/parallel-rx-ram.vvp

  rx-differential:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        data-width: [8, 16, 32]
        payload-length: [0, 1, 3, 4, 5, 7, 31, 4095, 4096]
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile differential RX test
        run: |
          iverilog -g2012 -s tb_bonded_wire_rx_lane_parallel_differential \
            -Ptb_bonded_wire_rx_lane_parallel_differential.DATA_WIDTH=${{ matrix.data-width }} \
            -Ptb_bonded_wire_rx_lane_parallel_differential.PAYLOAD_LEN=${{ matrix.payload-length }} \
            -o /tmp/parallel-rx-diff.vvp \
            rtl/bonded_payload_word_ram.sv \
            rtl/bonded_wire_rx_lane_parallel.sv \
            rtl/bonded_wire_rx_lane_parallel_ram.sv \
            rtl/tb_bonded_wire_rx_lane_parallel_differential.sv
      - name: Simulate differential RX test
        run: vvp /tmp/parallel-rx-diff.vvp
