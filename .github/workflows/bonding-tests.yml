name: Bonding reference-model tests

on:
  push:
    branches:
      - main
      - feature/bonded-serdes-interconnect
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bonding-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bonding unit and integration tests
        run: python -m unittest discover -s test -p "test_bonding_*.py" -v

  rtl-frame-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile and run frame TX testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_frame_boundary -o /tmp/tb_frame_boundary \
            rtl/bonded_frame_tx.sv rtl/tb_bonded_frame_boundary.sv
          vvp /tmp/tb_frame_boundary
      - name: Compile and run frame RX testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_frame_rx -o /tmp/tb_frame_rx \
            rtl/bonded_frame_rx.sv rtl/tb_bonded_frame_rx.sv
          vvp /tmp/tb_frame_rx

      - name: Compile and run configurable-width stream testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_stream_width -o /tmp/tb_stream_width \
            rtl/bonded_stream_tx.sv rtl/bonded_stream_rx.sv rtl/tb_bonded_stream_width.sv
          vvp /tmp/tb_stream_width
      - name: Compile and run elastic width adapter testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_width_adapter -o /tmp/tb_width_adapter \
            rtl/bonded_width_adapter.sv rtl/tb_bonded_width_adapter.sv
          vvp /tmp/tb_width_adapter
      - name: Compile configurable-width RX module
        run: |
          iverilog -g2012 -Wall -tnull rtl/bonded_stream_rx.sv

      - name: Compile and run asynchronous FIFO CDC testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_async_fifo -o /tmp/tb_async_fifo \
            rtl/bonded_async_fifo.sv rtl/tb_bonded_async_fifo.sv
          vvp /tmp/tb_async_fifo

      - name: Compile and run two-lane CDC integration testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_two_lane_cdc -o /tmp/tb_two_lane_cdc \
            rtl/bonded_async_fifo.sv rtl/bonded_two_lane_cdc.sv rtl/tb_bonded_two_lane_cdc.sv
          vvp /tmp/tb_two_lane_cdc

      - name: Compile and run packet-level round-robin TX testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_packet_tx -o /tmp/tb_packet_tx \
            rtl/bonded_packet_tx.sv rtl/tb_bonded_packet_tx.sv
          vvp /tmp/tb_packet_tx

      - name: Compile and run v0 wire TX golden-vector testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_wire_tx_lane -o /tmp/tb_wire_tx \
            rtl/bonded_wire_tx_lane.sv rtl/tb_bonded_wire_tx_lane.sv
          vvp /tmp/tb_wire_tx

      - name: Compile and run v0 wire RX interoperability testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_wire_rx_lane -o /tmp/tb_wire_rx \
            rtl/bonded_wire_rx_lane.sv rtl/tb_bonded_wire_rx_lane.sv
          vvp /tmp/tb_wire_rx

      - name: Compile and run in-order multi-lane packet RX testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_packet_rx -o /tmp/tb_packet_rx \
            rtl/bonded_packet_rx.sv rtl/tb_bonded_packet_rx.sv
          vvp /tmp/tb_packet_rx

      - name: Compile and run end-to-end two-lane wire RX and CDC testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_two_lane_rx -o /tmp/tb_two_lane_rx \
            rtl/bonded_wire_rx_lane.sv rtl/bonded_wire_rx_demux.sv rtl/bonded_control_frame_rx.sv \
            rtl/bonded_async_fifo.sv rtl/bonded_two_lane_cdc.sv rtl/bonded_packet_rx.sv rtl/bonded_credit_manager.sv \
            rtl/bonded_two_lane_rx.sv rtl/tb_bonded_two_lane_rx.sv
          vvp /tmp/tb_two_lane_rx

      - name: Compile and run end-to-end two-lane TX and wire loopback testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_two_lane_tx -o /tmp/tb_two_lane_tx \
            rtl/bonded_packet_tx.sv rtl/bonded_credit_manager.sv rtl/bonded_async_fifo.sv \
            rtl/bonded_wire_tx_lane.sv rtl/bonded_wire_rx_lane.sv \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_queue.sv \
            rtl/bonded_lane_frame_arbiter.sv rtl/bonded_lane_tx_mux.sv \
            rtl/bonded_two_lane_tx.sv rtl/tb_bonded_two_lane_tx.sv
          vvp /tmp/tb_two_lane_tx

      - name: Compile and run full-duplex two-endpoint bonded link testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_two_lane_endpoint -o /tmp/tb_two_lane_endpoint \
            rtl/bonded_packet_tx.sv rtl/bonded_credit_manager.sv rtl/bonded_async_fifo.sv \
            rtl/bonded_wire_tx_lane.sv rtl/bonded_wire_rx_lane.sv \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_queue.sv \
            rtl/bonded_lane_frame_arbiter.sv rtl/bonded_lane_tx_mux.sv \
            rtl/bonded_two_lane_tx.sv rtl/bonded_two_lane_cdc.sv \
            rtl/bonded_packet_rx.sv rtl/bonded_wire_rx_demux.sv rtl/bonded_control_frame_rx.sv \
            rtl/bonded_two_lane_rx.sv rtl/bonded_session_gate.sv rtl/bonded_two_lane_endpoint.sv rtl/tb_bonded_two_lane_endpoint.sv
          vvp /tmp/tb_two_lane_endpoint

      - name: Compile and run cumulative byte/packet credit RTL testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_credit_manager -o /tmp/tb_credit \
            rtl/bonded_credit_manager.sv rtl/tb_bonded_credit_manager.sv
          vvp /tmp/tb_credit

      - name: Compile and run v0 CONTROL frame encoder testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_control_frame_tx -o /tmp/tb_control_tx \
            rtl/bonded_control_frame_tx.sv rtl/tb_bonded_control_frame_tx.sv
          vvp /tmp/tb_control_tx

      - name: Compile and run CONTROL-priority frame arbiter testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_lane_frame_arbiter -o /tmp/tb_lane_arbiter \
            rtl/bonded_lane_frame_arbiter.sv rtl/tb_bonded_lane_frame_arbiter.sv
          vvp /tmp/tb_lane_arbiter

      - name: Compile and run composed per-lane CONTROL/DATA TX testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_lane_tx_mux -o /tmp/tb_lane_tx_mux \
            rtl/bonded_control_frame_tx.sv rtl/bonded_wire_tx_lane.sv \
            rtl/bonded_lane_frame_arbiter.sv rtl/bonded_control_queue.sv \
            rtl/bonded_lane_tx_mux.sv rtl/tb_bonded_lane_tx_mux.sv
          vvp /tmp/tb_lane_tx_mux

      - name: Compile and run CONTROL frame encoder/decoder loopback
        run: |
          iverilog -g2012 -Wall -s tb_bonded_control_frame_loopback -o /tmp/tb_control_loopback \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_frame_rx.sv \
            rtl/tb_bonded_control_frame_loopback.sv
          vvp /tmp/tb_control_loopback


      - name: Compile and run CONTROL queue regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_control_queue -o /tmp/tb_control_queue \
            rtl/bonded_control_queue.sv rtl/tb_bonded_control_queue.sv
          vvp /tmp/tb_control_queue

      - name: Compile and run frame-atomic arbitration regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_lane_frame_arbiter_atomic -o /tmp/tb_lane_arbiter_atomic \
            rtl/bonded_lane_frame_arbiter.sv rtl/tb_bonded_lane_frame_arbiter_atomic.sv
          vvp /tmp/tb_lane_arbiter_atomic

      - name: Compile and run integrated two-lane CONTROL RX testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_two_lane_rx_control -o /tmp/tb_two_lane_rx_control \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_frame_rx.sv \
            rtl/bonded_wire_rx_demux.sv rtl/bonded_wire_rx_lane.sv \
            rtl/bonded_async_fifo.sv rtl/bonded_two_lane_cdc.sv \
            rtl/bonded_packet_rx.sv rtl/bonded_credit_manager.sv rtl/bonded_two_lane_rx.sv \
            rtl/tb_bonded_two_lane_rx_control.sv
          vvp /tmp/tb_two_lane_rx_control

      - name: Compile and run autonomous two-node control and DATA regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_two_lane_node -o /tmp/tb_two_lane_node \
            rtl/bonded_control_manager.sv rtl/bonded_two_lane_node.sv \
            rtl/bonded_two_lane_endpoint.sv rtl/bonded_two_lane_tx.sv rtl/bonded_two_lane_rx.sv \
            rtl/bonded_packet_tx.sv rtl/bonded_credit_manager.sv rtl/bonded_async_fifo.sv \
            rtl/bonded_wire_tx_lane.sv rtl/bonded_wire_rx_lane.sv \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_frame_rx.sv \
            rtl/bonded_control_queue.sv rtl/bonded_lane_frame_arbiter.sv rtl/bonded_lane_tx_mux.sv \
            rtl/bonded_wire_rx_demux.sv rtl/bonded_wire_rx_framer.sv rtl/bonded_sync_byte_fifo.sv rtl/bonded_two_lane_cdc.sv rtl/bonded_packet_rx.sv \
            rtl/bonded_session_gate.sv rtl/tb_bonded_two_lane_node.sv
          vvp /tmp/tb_two_lane_node

      - name: Compile and run RX demux session-abort recovery testbench
        run: |
          iverilog -g2012 -Wall -s tb_bonded_wire_rx_demux -o /tmp/tb_rx_demux \
            rtl/bonded_wire_rx_demux.sv rtl/tb_bonded_wire_rx_demux.sv
          vvp /tmp/tb_rx_demux

      - name: Compile and run RTL control manager regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_control_manager -o /tmp/tb_control_manager \
            rtl/bonded_control_manager.sv rtl/tb_bonded_control_manager.sv
          vvp /tmp/tb_control_manager

      - name: Compile and run raw-byte RX framer regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_wire_rx_framer -o /tmp/tb_wire_framer \
            rtl/bonded_control_frame_tx.sv rtl/bonded_wire_rx_framer.sv \
            rtl/tb_bonded_wire_rx_framer.sv
          vvp /tmp/tb_wire_framer

      - name: Compile and run generic 8b10b PHY byte adapter regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_phy_8b10b_adapter -o /tmp/tb_phy_8b10b \
            rtl/bonded_phy_8b10b_adapter.sv rtl/tb_bonded_phy_8b10b_adapter.sv
          vvp /tmp/tb_phy_8b10b

      - name: Compile and run safe one-byte-per-word PHY rate regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_byte_to_phy_word_rate -o /tmp/tb_phy_byte_rate \
            rtl/bonded_byte_to_phy_word.sv rtl/tb_bonded_byte_to_phy_word_rate.sv
          vvp /tmp/tb_phy_byte_rate

      - name: Compile and run parallel 8b10b PHY word adapter regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_phy_8b10b_word_adapter -o /tmp/tb_phy_word \
            rtl/bonded_phy_8b10b_word_adapter.sv rtl/tb_bonded_phy_8b10b_word_adapter.sv
          vvp /tmp/tb_phy_word

      - name: Compile and run byte/parallel-PHY word gearbox loopback regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_phy_word_gearbox -o /tmp/tb_phy_gearbox \
            rtl/bonded_byte_to_phy_word.sv rtl/bonded_phy_8b10b_word_adapter.sv \
            rtl/bonded_phy_word_to_byte.sv rtl/bonded_phy_8b10b_lane_adapter.sv rtl/bonded_async_fifo.sv rtl/tb_bonded_phy_word_gearbox.sv
          vvp /tmp/tb_phy_gearbox

      - name: Compile and run per-lane PHY bridge CDC regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_lane_phy_word_bridge -o /tmp/tb_lane_phy_bridge \
            rtl/bonded_async_fifo.sv rtl/bonded_byte_to_phy_word.sv \
            rtl/bonded_phy_8b10b_word_adapter.sv rtl/bonded_phy_word_to_byte.sv \
            rtl/bonded_lane_phy_word_bridge.sv rtl/tb_bonded_lane_phy_word_bridge.sv
          vvp /tmp/tb_lane_phy_bridge

      - name: Compile and run end-to-end two-node parallel PHY word transport
        run: |
          iverilog -g2012 -Wall -s tb_bonded_two_lane_phy_word_node -o /tmp/tb_two_lane_phy_node \
            rtl/bonded_control_manager.sv rtl/bonded_two_lane_node.sv \
            rtl/bonded_two_lane_endpoint.sv rtl/bonded_two_lane_tx.sv rtl/bonded_two_lane_rx.sv \
            rtl/bonded_packet_tx.sv rtl/bonded_credit_manager.sv rtl/bonded_async_fifo.sv \
            rtl/bonded_wire_tx_lane.sv rtl/bonded_wire_rx_lane.sv \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_frame_rx.sv \
            rtl/bonded_control_queue.sv rtl/bonded_lane_frame_arbiter.sv rtl/bonded_lane_tx_mux.sv \
            rtl/bonded_wire_rx_demux.sv rtl/bonded_wire_rx_framer.sv rtl/bonded_sync_byte_fifo.sv \
            rtl/bonded_two_lane_cdc.sv rtl/bonded_packet_rx.sv rtl/bonded_session_gate.sv \
            rtl/bonded_byte_to_phy_word.sv rtl/bonded_phy_8b10b_word_adapter.sv \
            rtl/bonded_phy_word_to_byte.sv rtl/bonded_lane_phy_word_bridge.sv \
            rtl/bonded_two_lane_phy_word_node.sv rtl/tb_bonded_two_lane_phy_word_node.sv
          vvp /tmp/tb_two_lane_phy_node

      - name: Compile and run PHY bridge session-flush recovery regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_lane_phy_session_flush -o /tmp/tb_phy_session_flush \
            rtl/bonded_byte_to_phy_word.sv rtl/bonded_phy_8b10b_word_adapter.sv \
            rtl/bonded_phy_word_to_byte.sv rtl/bonded_lane_phy_word_bridge.sv \
            rtl/tb_bonded_lane_phy_session_flush.sv
          vvp /tmp/tb_phy_session_flush

      - name: Compile and run duplicate remote lane-ID rejection regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_duplicate_remote_lane_id -o /tmp/tb_duplicate_lane_id \
            rtl/bonded_control_manager.sv rtl/bonded_two_lane_node.sv \
            rtl/bonded_two_lane_endpoint.sv rtl/bonded_two_lane_tx.sv rtl/bonded_two_lane_rx.sv \
            rtl/bonded_packet_tx.sv rtl/bonded_credit_manager.sv rtl/bonded_async_fifo.sv \
            rtl/bonded_wire_tx_lane.sv rtl/bonded_wire_rx_lane.sv \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_frame_rx.sv \
            rtl/bonded_control_queue.sv rtl/bonded_lane_frame_arbiter.sv rtl/bonded_lane_tx_mux.sv \
            rtl/bonded_wire_rx_demux.sv rtl/bonded_wire_rx_framer.sv rtl/bonded_sync_byte_fifo.sv \
            rtl/bonded_two_lane_cdc.sv rtl/bonded_packet_rx.sv rtl/bonded_session_gate.sv \
            rtl/bonded_byte_to_phy_word.sv rtl/bonded_phy_8b10b_word_adapter.sv \
            rtl/bonded_phy_word_to_byte.sv rtl/bonded_lane_phy_word_bridge.sv \
            rtl/bonded_two_lane_phy_word_node.sv rtl/tb_bonded_duplicate_remote_lane_id.sv
          vvp /tmp/tb_duplicate_lane_id

      - name: Compile and run asymmetric lane-loss heartbeat regression
        run: |
          iverilog -g2012 -Wall -s tb_bonded_asymmetric_lane_loss -o /tmp/tb_asymmetric_lane_loss \
            rtl/bonded_control_manager.sv rtl/bonded_two_lane_node.sv \
            rtl/bonded_two_lane_endpoint.sv rtl/bonded_two_lane_tx.sv rtl/bonded_two_lane_rx.sv \
            rtl/bonded_packet_tx.sv rtl/bonded_credit_manager.sv rtl/bonded_async_fifo.sv \
            rtl/bonded_wire_tx_lane.sv rtl/bonded_wire_rx_lane.sv \
            rtl/bonded_control_frame_tx.sv rtl/bonded_control_frame_rx.sv \
            rtl/bonded_control_queue.sv rtl/bonded_lane_frame_arbiter.sv rtl/bonded_lane_tx_mux.sv \
            rtl/bonded_wire_rx_demux.sv rtl/bonded_wire_rx_framer.sv rtl/bonded_sync_byte_fifo.sv \
            rtl/bonded_two_lane_cdc.sv rtl/bonded_packet_rx.sv rtl/bonded_session_gate.sv \
            rtl/bonded_byte_to_phy_word.sv rtl/bonded_phy_8b10b_word_adapter.sv \
            rtl/bonded_phy_word_to_byte.sv rtl/bonded_lane_phy_word_bridge.sv \
            rtl/bonded_two_lane_phy_word_node.sv rtl/tb_bonded_asymmetric_lane_loss.sv
          vvp /tmp/tb_asymmetric_lane_loss
